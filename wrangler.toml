name = "freshcontext-worker"
main = "src/worker.js"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Both values below are read by src/worker.js when it calls the Browser Rendering
# API, and both are set as secrets rather than plaintext vars:
#
#   npx wrangler secret put ACCOUNT_ID
#   npx wrangler secret put CF_API_TOKEN
#
# ACCOUNT_ID previously lived in [vars] in this file, which published the account
# identifier in a public repository. On its own it is not a credential, but it is
# one half of the pair used in the Authorization header in worker.js, and nothing
# about this Worker requires it to be public.
